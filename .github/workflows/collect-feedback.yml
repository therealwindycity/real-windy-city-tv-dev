name: Collect site feedback
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["feedback/comments.json"]
permissions:
  contents: write
  issues: write
concurrency:
  group: collect-feedback
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect new notes from the dev and beta sites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 feedback/collect.py
      - name: Save to the repo
        run: |
          git config user.name "rwc-feedback-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback/comments.json feedback/COMMENTS.md feedback/.collector_state.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Feedback: $(python3 -c 'import json;c=json.load(open("feedback/comments.json"));print(sum(1 for x in c if x.get("status")=="open"),"open /",len(c),"total")')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
